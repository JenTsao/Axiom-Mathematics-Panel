version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    ignore:
      # 项目支持 Python 3.10–3.11（code-quality.yml 固定 3.11），networkx 3.7+ 仅支持 >=3.12
      - dependency-name: "networkx"
        versions: [">=3.7"]

  - package-ecosystem: "pip"
    directory: "/mathlab"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    ignore:
      - dependency-name: "networkx"
        versions: [">=3.7"]

  - package-ecosystem: "npm"
    directory: "/mathlab/resources/web_src"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
