name: Secret Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check mathlab/settings.json ai_api_key is empty
        run: |
          python3 -c "
          import json, sys
          data = json.load(open('mathlab/settings.json', encoding='utf-8'))
          key = data.get('ai_api_key', '')
          if key:
              print('❌ mathlab/settings.json contains a non-empty ai_api_key!')
              sys.exit(1)
          print('✅ mathlab/settings.json ai_api_key is empty')
          "

      - name: Install & Run Gitleaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks git . --verbose --redact --config .gitleaks.toml
          gitleaks dir . --verbose --redact --config .gitleaks.toml
