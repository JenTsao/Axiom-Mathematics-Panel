name: Build Smoke

# 打包冒烟：两段式（整体由下方 paths 限定为「打包相关路径变更」才触发）。
#   1. spec-static（秒级、零依赖）：AST 校验 spec / 入口 / hiddenimports，先行拦截。
#   2. pyinstaller（重）：PR 只跑 Linux 单平台，push main / 手动触发才跑
#      Linux + Windows 双平台。
# 目的：`mathlab.spec` / `setup.py` / 依赖清单 / hiddenimports 的错误，此前只在
# release.yml 打包时才暴露；这里做「预演」，但不让普通业务代码改动付出全量打包成本。
#
# 注 1：`.github/workflows/_build-setup.yml` 因 GitHub Actions 的 job 之间不共享
#       runner 环境（环境准备 job 结束后即销毁），无法被有效复用，故本工作流自含步骤。
# 注 2：绝不在 CI 里 `import mathlab.main`。该模块导入期就会初始化日志、清理临时
#       文件、装全局 excepthook 并拉起 QtWebEngine / MainWindow 整条 GUI 栈，
#       headless runner 上曾以 exit code 127 中止（日志停在 main.py:134）。
#       导入冒烟改由 `scripts/check_build_spec.py --import-smoke` 在独立子进程里
#       只导入无副作用的纯逻辑模块。

on:
  push:
    branches: [main, develop]
    # 刻意不含 'mathlab/**.py'：普通业务代码改动不触发全量打包，交给 test.yml 覆盖
    paths:
      - 'mathlab/*.spec'
      - 'mathlab/main.py'
      - 'mathlab/setup.py'
      - 'mathlab/scripts/check_build_spec.py'
      - 'requirements.txt'
      - 'mathlab/requirements.txt'
      - 'MathLab.CSharpEngine/**'
      - 'mathlab/resources/**'
      - '.github/workflows/build-smoke.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'mathlab/*.spec'
      - 'mathlab/main.py'
      - 'mathlab/setup.py'
      - 'mathlab/scripts/check_build_spec.py'
      - 'requirements.txt'
      - 'mathlab/requirements.txt'
      - 'MathLab.CSharpEngine/**'
      - 'mathlab/resources/**'
      - '.github/workflows/build-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '24'
  # headless runner：禁止任何 Qt 平台插件初始化
  QT_QPA_PLATFORM: offscreen
  PYTHONIOENCODING: utf-8

jobs:
  # ── 轻量前置：不需要 .NET / Node / PySide6 / PyInstaller ───────────────────
  spec-static:
    name: Spec & entrypoint (static)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check spec, entrypoint and hiddenimports
        run: python mathlab/scripts/check_build_spec.py --report

  # ── 重量打包：PR 单平台，push / 手动双平台 ─────────────────────────────────
  pyinstaller:
    name: PyInstaller ONEDIR (${{ matrix.os }})
    needs: spec-static
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["ubuntu-24.04", "windows-2022"]') }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build C# engine
        run: dotnet build MathLab.CSharpEngine/MathLab.CSharpEngine.csproj -c Release

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mathlab/resources/web_src/package-lock.json

      - name: Build frontend bundles
        run: |
          cd mathlab/resources/web_src
          npm ci --prefer-offline --no-audit --no-fund
          npm run build:all

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6,<7"

      - name: Run PyInstaller
        run: pyinstaller mathlab.spec --clean --noconfirm

      - name: Verify ONEDIR artifacts (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          test -d dist/MathLab || { echo "::error::dist/MathLab 目录缺失"; exit 1; }
          test -x dist/MathLab/mathlab || { echo "::error::主可执行文件缺失"; exit 1; }
          for p in dist/MathLab/_internal/locale dist/MathLab/_internal; do
            test -e "$p" || echo "::warning::未找到 $p（ONEDIR 布局可能不同，仅提示）"
          done
          echo "ONEDIR 产物结构检查通过"
          du -sh dist/MathLab | tail -1

      - name: Verify ONEDIR artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/MathLab')) { Write-Error 'dist/MathLab 目录缺失'; exit 1 }
          if (-not (Test-Path 'dist/MathLab/mathlab.exe')) { Write-Error '主可执行文件缺失'; exit 1 }
          Write-Host "ONEDIR 产物结构检查通过"
          Get-ChildItem dist/MathLab | Select-Object -First 10 Name

      - name: Import smoke test (isolated subprocesses)
        shell: bash
        run: |
          set -euo pipefail
          # 显式校验解释器，避免 PATH 问题退化成难以定位的 exit 127
          command -v python >/dev/null 2>&1 || { echo "::error::python 不在 PATH 上"; exit 1; }
          # 每个模块在独立子进程中导入；不触碰 mathlab.main 的 GUI 启动链
          python mathlab/scripts/check_build_spec.py --import-smoke --report

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: build-smoke-${{ matrix.os }}
          path: |
            build/*.toc
            build/*.log
          retention-days: 7
          if-no-files-found: ignore
