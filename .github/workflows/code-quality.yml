name: Code Quality

# ── 触发条件 ──────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, develop]
    paths:
      - 'mathlab/**.py'
      - 'requirements.txt'
      - '.github/workflows/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'mathlab/**.py'
      - 'requirements.txt'
      - '.github/workflows/**'
  workflow_dispatch:

# ── 权限配置（最小权限原则）──────────────────────────────────────────────
permissions:
  contents: read
  checks: write
  pull-requests: write

# ── 并发控制 ──────────────────────────────────────────────────────────────
concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'

# 原先 flake8 / bandit / black+isort / ui-style-guard / import-check 是 5 个
# 互不依赖的 job，各自都只做静态扫描、都不需要 requirements.txt，却各自要
# 启动一次 runner + setup-python。合并成 static-lint 后 PR 少 4 个 job。
jobs:
  # ────────────────────────────────────────────────────────────────────────
  # Job 1: 纯静态检查（零项目依赖，一次安装全部 linter）
  # ────────────────────────────────────────────────────────────────────────
  static-lint:
    name: Static Lint (Flake8 / Bandit / Black / Isort / Guards / Imports)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        run: pip install flake8 flake8-pyproject bandit black isort

      # 下列步骤一律跑完再汇总失败，避免「修一个红一个、再推一次」的往返。
      - name: Run Flake8
        if: always()
        run: |
          echo "🔍 正在检查代码风格 (Flake8)..."
          flake8 mathlab/ \
            --max-line-length=120 \
            --extend-ignore=E203,W503,E501 \
            --exclude=mathlab/resources/,mathlab/logs/ \
            --count \
            --statistics \
            --show-source

      - name: Run Bandit security scan
        if: always()
        run: |
          echo "🔍 正在进行安全扫描 (Bandit)..."
          bandit -r mathlab/ \
            -x mathlab/resources,mathlab/logs \
            -f json \
            -o bandit-report.json \
            -ll \
            -c .bandit

      - name: Check Black formatting
        if: always()
        run: |
          echo "🔍 检查 Black 代码格式..."
          black mathlab/ \
            --check \
            --line-length=120 \
            --extend-exclude='mathlab/resources|mathlab/logs' \
            --diff

      - name: Check Isort import order
        if: always()
        run: |
          echo "🔍 检查 Isort 导入顺序..."
          isort mathlab/ \
            --check-only \
            --profile black \
            --skip-glob='mathlab/resources/*' \
            --skip-glob='mathlab/logs/*' \
            --diff

      # UI 样式与 i18n 防回潮（UI_SYSTEM_DESIGN.md §7.3）
      - name: Run UI style guard
        if: always()
        run: |
          echo "🔍 正在检查 UI 内联样式与未连接 QAction..."
          python mathlab/scripts/check_ui_style.py

      - name: Run i18n guard
        if: always()
        run: |
          echo "🔍 正在检查 i18n 覆盖与未本地化文案..."
          python mathlab/scripts/check_i18n.py

      # 纯 AST 检查内部导入路径，同样不需要安装 requirements.txt
      - name: Verify all internal imports
        if: always()
        run: |
          echo "🔍 正在验证所有内部导入的完整性..."
          python -c "
          import ast
          import os
          import sys
          from pathlib import Path

          errors = []
          mathlab_dir = Path('mathlab')

          for py_file in mathlab_dir.rglob('*.py'):
              if 'resources' in py_file.parts:
                  continue
              try:
                  with open(py_file, 'r', encoding='utf-8') as f:
                      tree = ast.parse(f.read(), filename=str(py_file))

                  for node in ast.walk(tree):
                      if isinstance(node, ast.ImportFrom):
                          module = node.module or ''
                          if module.startswith('mathlab'):
                              for alias in node.names:
                                  name = alias.name
                                  if name.startswith('_') or name in ('*',):
                                      continue
                                  module_path = module.replace('.', '/') + '.py'
                                  if not os.path.exists(module_path):
                                      pkg_path = module.replace('.', '/') + '/__init__.py'
                                      if not os.path.exists(pkg_path):
                                          errors.append(f'{py_file}:{node.lineno}: 模块 {module} 不存在')
              except SyntaxError as e:
                  errors.append(f'{py_file}: 语法错误 - {e}')

          if errors:
              print('❌ 发现导入问题:')
              for err in errors:
                  print(f'  - {err}')
              sys.exit(1)
          else:
              print('✅ 所有内部导入检查通过')
          "

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 14
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────────────
  # Job 2: 代码分析 (Pylint) —— 需要项目依赖才能解析导入
  # ────────────────────────────────────────────────────────────────────────
  pylint:
    name: Pylint Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Pylint and dependencies
        run: |
          pip install pylint
          pip install -r requirements.txt

      - name: Check and prepare pylint config
        run: |
          if [ ! -f .pylintrc ]; then
            echo "⚠️ .pylintrc not found, creating default config..."
            printf '[MASTER]\ninit-hook=\ndisable=\n    C0114,\n    C0115,\n    C0116,\n    R0801,\n\n[MESSAGES CONTROL]\ndisable=\n    W0703,\n    R0903,\n    R0913,\n    R0914,\n    R0915,\n    W0611,\n    W0212,\n\n[REPORTS]\nreports=no\n\n[TYPECHECK]\nignored-modules=PyQt6,\n                 PyQt6.QtWidgets,\n                 PyQt6.QtGui,\n                 PyQt6.QtCore,\n                 PyQt6.QtCharts,\n                 PyQt6.QtSvg,\n                 numpy,\n                 scipy,\n                 matplotlib,\n\n[FORMAT]\nmax-line-length=120\n' > .pylintrc
          fi
          ls -la .pylintrc

      - name: Run Pylint
        run: |
          echo "🔍 正在进行深度代码分析 (Pylint)..."
          pylint mathlab/ \
            --rcfile=.pylintrc \
            --disable=R,C \
            --fail-under=5.0 \
            --output-format=parseable > pylint-report.txt

      - name: Upload Pylint report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: pylint-report
          path: pylint-report.txt
          retention-days: 14

  # ────────────────────────────────────────────────────────────────────────
  # Job 3: 类型检查 (MyPy)
  # ────────────────────────────────────────────────────────────────────────
  mypy:
    name: MyPy Type Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install MyPy and dependencies
        run: |
          pip install mypy types-PyYAML
          pip install -r requirements.txt

      - name: Run MyPy
        run: |
          echo "🔍 正在进行类型检查 (MyPy)..."
          mypy mathlab/ --config-file mypy.ini

  # ────────────────────────────────────────────────────────────────────────
  # Job 4: 依赖安全 (Safety) —— 仅 push / 手动触发
  # PR 依赖没变时由 dependency-audit.yml 的 pip-audit 覆盖，不必每个 PR 重扫。
  # ────────────────────────────────────────────────────────────────────────
  safety:
    name: Safety Dependency Check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Safety
        run: pip install safety

      - name: Run Safety check
        run: |
          echo "🔍 正在检查依赖安全漏洞 (Safety)..."
          safety check \
            --file=requirements.txt \
            --output=json \
            --save-json=safety-report.json

      - name: Upload Safety report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: safety-report
          path: safety-report.json
          retention-days: 14
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────────────
  # Job 5: GitHub Actions 工作流自检 (actionlint)
  # ────────────────────────────────────────────────────────────────────────
  actionlint:
    name: Workflow Lint (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run actionlint
        uses: raven-actions/actionlint@980c24ed9186b7cd9b4eb35d1e5b7cf86e33efad # v2.0.0

  # ────────────────────────────────────────────────────────────────────────
  # Job 6: 汇总报告
  # ────────────────────────────────────────────────────────────────────────
  summary:
    name: Quality Summary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [static-lint, pylint, mypy, safety, actionlint]
    if: always()
    steps:
      - name: Generate summary
        env:
          STATIC_LINT_RESULT: ${{ needs.static-lint.result }}
          PYLINT_RESULT: ${{ needs.pylint.result }}
          MYPY_RESULT: ${{ needs.mypy.result }}
          SAFETY_RESULT: ${{ needs.safety.result }}
          ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
        run: |
          {
            echo "## 📊 代码质量检查报告"
            echo ""
            echo "| 检查项 | 状态 |"
            echo "|--------|------|"
            echo "| 静态检查（Flake8 / Bandit / Black / Isort / UI+i18n / 导入完整性） | ${STATIC_LINT_RESULT} |"
            echo "| Pylint 代码分析 | ${PYLINT_RESULT} |"
            echo "| MyPy 类型检查 | ${MYPY_RESULT} |"
            echo "| Safety 依赖检查（仅 push） | ${SAFETY_RESULT} |"
            echo "| Workflow Lint (actionlint) | ${ACTIONLINT_RESULT} |"
            echo ""
            echo "状态说明: ✅ success = 通过, ❌ failure = 失败, ⏭️ skipped = 跳过"
          } >> "$GITHUB_STEP_SUMMARY"
