name: Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'mathlab/**.py'
      - 'mathlab/ui/styles.qss'
      - 'mathlab/utils/theme_tokens.py'
      - 'mathlab/**.spec'
      - 'requirements.txt'
      - 'MathLab.CSharpEngine/**'
      - 'mathlab/resources/web_src/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'mathlab/**.py'
      - 'mathlab/ui/styles.qss'
      - 'mathlab/utils/theme_tokens.py'
      - 'mathlab/**.spec'
      - 'requirements.txt'
      - 'MathLab.CSharpEngine/**'
      - 'mathlab/resources/web_src/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '24'

jobs:
  test:
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # PR 只跑 1 个 job 拿快速反馈；push main / 手动触发才展开完整 3×3 矩阵。
        # 9 → 1 是 PR 阶段最大的一笔耗时节省，且不降低 main 分支的覆盖。
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["ubuntu-24.04", "windows-2022", "macos-14"]') }}
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.11"]' || '["3.10", "3.11", "3.12"]') }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build MathLab C# Engine
        run: dotnet build MathLab.CSharpEngine/MathLab.CSharpEngine.csproj -c Release

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mathlab/resources/web_src/package-lock.json

      - name: Build & Check Webpack Frontend
        run: |
          cd mathlab/resources/web_src
          npm ci
          npx tsc --noEmit
          npm audit --audit-level=high
          # build:all 才会同时产出 monaco.bundle.js 与 omni_bar.bundle.js；
          # resources/dist 被 .gitignore 排除，只跑 build 会让 OmniBar 在 CI 产物里空白
          npm run build:all

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Linux GUI dependencies (xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils libegl1 libgl1 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-qt pytest-cov

      # 原来 unit / root / integration / e2e 分 4 次启动 pytest，每次都重做一遍
      # 测试收集与 coverage 插桩。合并成 2 次：
      #   ① mathlab/tests/ 全量（排除 e2e），-m "not slow"，含顶层的分层架构断言；
      #   ② e2e 单独跑（沿用原语义，不加 -m），用 --cov-append 合并覆盖率。
      - name: Run unit + root + integration tests (Windows / macOS)
        if: runner.os != 'Linux'
        run: >-
          pytest mathlab/tests/ --ignore=mathlab/tests/e2e
          -v --tb=long -m "not slow"
          --junitxml=test-results/main-results.xml
          --cov=mathlab --cov-report=xml --cov-report=term-missing --cov-branch

      - name: Run unit + root + integration tests (Linux)
        if: runner.os == 'Linux'
        run: >-
          xvfb-run --auto-servernum pytest mathlab/tests/ --ignore=mathlab/tests/e2e
          -v --tb=long -m "not slow"
          --junitxml=test-results/main-results.xml
          --cov=mathlab --cov-report=xml --cov-report=term-missing --cov-branch

      - name: Run e2e tests (Windows / macOS)
        if: runner.os != 'Linux'
        run: >-
          pytest mathlab/tests/e2e/ -v --tb=long
          --junitxml=test-results/e2e-results.xml
          --cov=mathlab --cov-append --cov-report=xml --cov-report=term-missing

      - name: Run e2e tests (Linux)
        if: runner.os == 'Linux'
        run: >-
          xvfb-run --auto-servernum pytest mathlab/tests/e2e/ -v --tb=long
          --junitxml=test-results/e2e-results.xml
          --cov=mathlab --cov-append --cov-report=xml --cov-report=term-missing

      # 覆盖率棘轮门槛（只许升不许降）：合并 unit + integration + e2e 后的总覆盖率下限
      - name: Enforce coverage threshold (ratchet)
        run: python -m coverage report --fail-under=35

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            test-results/
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            test-results/coverage.xml
            .coverage
          retention-days: 14
